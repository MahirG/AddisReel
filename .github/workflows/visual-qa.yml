name: AddisReel visual QA screenshots
on:
  push:
    branches: ['feature/addisreel-v150-design-system']
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - '.github/scripts/visual-qa-android.sh'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Checkout published Build 23 source for before screenshots
        uses: actions/checkout@v4
        with:
          ref: feature/addisreel-v140-watch-integrity
          path: before
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble unchanged Build 23 baseline
        run: gradle -p before :app:assembleDebug --no-daemon --console=plain
      - name: Assemble candidate Android design APK
        run: gradle :app:assembleDebug --no-daemon --console=plain
      - name: Enable and verify KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Capture baseline and redesigned UI at 100%, 150% and 200% font scale
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash .github/scripts/visual-qa-android.sh
      - name: Upload before/after screenshots and accessibility dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AddisReel-visual-before-after
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 21
