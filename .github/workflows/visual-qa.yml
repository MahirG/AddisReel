name: AddisReel visual QA screenshots
on:
  push:
    branches: ['feature/addisreel-v150-design-system']
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - '.github/scripts/visual-qa-android.sh'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-screenshots:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - stage: baseline
            theme: 'yes'
            font: '1.0'
            device: normal
          - stage: baseline
            theme: 'yes'
            font: '1.5'
            device: normal
          - stage: baseline
            theme: 'no'
            font: '1.0'
            device: normal
          - stage: baseline
            theme: 'no'
            font: '1.5'
            device: normal
          - stage: candidate
            theme: 'yes'
            font: '1.0'
            device: normal
          - stage: candidate
            theme: 'yes'
            font: '1.5'
            device: normal
          - stage: candidate
            theme: 'yes'
            font: '2.0'
            device: compact
          - stage: candidate
            theme: 'no'
            font: '1.0'
            device: normal
          - stage: candidate
            theme: 'no'
            font: '1.5'
            device: normal
          - stage: candidate
            theme: 'no'
            font: '2.0'
            device: compact
    env:
      QA_STAGE: ${{ matrix.stage }}
      QA_THEME: ${{ matrix.theme }}
      QA_FONT: ${{ matrix.font }}
      QA_DEVICE: ${{ matrix.device }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Checkout published Build 23 source for before screenshots
        uses: actions/checkout@v4
        with:
          ref: feature/addisreel-v140-watch-integrity
          path: before
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble unchanged Build 23 baseline
        if: matrix.stage == 'baseline'
        run: gradle -p before :app:assembleDebug --no-daemon --console=plain
      - name: Assemble candidate Android design APK
        if: matrix.stage == 'candidate'
        run: gradle :app:assembleDebug --no-daemon --console=plain
      - name: Configure KVM acceleration with software fallback
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30 || true
          if [ -c /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi
          if python3 -c 'import os,fcntl; fd=os.open("/dev/kvm",os.O_RDWR); assert fcntl.ioctl(fd,0xAE00,0)==12; os.close(fd)'; then
            echo "disabled=false" >> "$GITHUB_OUTPUT"
            echo "KVM verified"
          else
            echo "disabled=true" >> "$GITHUB_OUTPUT"
            echo "::warning::KVM unavailable; using software emulation"
          fi
      - name: Record host resource availability
        run: |
          free -h
          df -h
          nproc
      - name: Capture isolated visual configuration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 1800
          disable-linux-hw-accel: ${{ steps.kvm.outputs.disabled }}
          disable-animations: true
          script: bash .github/scripts/visual-qa-android.sh
      - name: Collect host diagnostics
        if: failure()
        run: |
          mkdir -p visual-qa
          free -h > visual-qa/host-memory.txt
          sudo dmesg -T | tail -300 > visual-qa/host-kernel.txt
      - name: Upload before/after screenshots and accessibility dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ matrix.stage }}-${{ matrix.theme }}-${{ matrix.font }}
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 21
  verify-all-captures:
    needs: device-screenshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: visual-*
          path: visual-qa
          merge-multiple: true
      - name: Verify complete capture matrix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root=Path('visual-qa')
          expected=set()
          for stage in ('baseline','candidate'):
              for theme in ('yes','no'):
                  for font in ('1.0','1.5','2.0') if stage=='candidate' else ('1.0','1.5'):
                      device='compact' if font=='2.0' else 'normal'
                      group=[f'{stage}-{device}-{theme}-font{font}-{tab}' for tab in ('home','watch','library','premium')]
                      expected.update(group)
                      assert len({sha256((root/(x+'.png')).read_bytes()).hexdigest() for x in group})>=3, group
          assert {p.stem for p in root.glob('*.png')}==expected
          assert {p.stem for p in root.glob('*.xml')}==expected
          print('40 screenshots and 40 accessibility trees present; manual visual approval still required.')
          PY
