name: AddisReel Studio Native APK
on:
  push:
    branches: [main, 'feature/**']
    paths: ['studio/**', 'settings.gradle.kts', 'build.gradle.kts', '.github/workflows/studio-android.yml']
  pull_request:
    branches: [main]
    paths: ['studio/**', 'settings.gradle.kts', 'build.gradle.kts', '.github/workflows/studio-android.yml']
  workflow_dispatch:
jobs:
  studio-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android API 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Studio APK
        shell: bash
        run: |
          set -o pipefail
          gradle :studio:assembleDebug --no-daemon --console=plain 2>&1 | tee studio-build.log
      - name: Verify installable Studio APK
        shell: bash
        run: |
          set -euo pipefail
          APK=studio/build/outputs/apk/debug/studio-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo "### AddisReel Studio APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: $(du -h "$APK"|cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $(sha256sum "$APK"|cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Studio debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AddisReel-Studio-Android-APK
          path: studio/build/outputs/apk/debug/studio-debug.apk
          retention-days: 30
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AddisReel-Studio-build-log
          path: studio-build.log
          if-no-files-found: ignore
          retention-days: 7
  studio-signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      ADDISREEL_KEYSTORE_B64: ${{ secrets.ADDISREEL_KEYSTORE_B64 }}
      ADDISREEL_KEYSTORE_PASSWORD: ${{ secrets.ADDISREEL_KEYSTORE_PASSWORD }}
      ADDISREEL_KEY_ALIAS: ${{ secrets.ADDISREEL_KEY_ALIAS }}
      ADDISREEL_KEY_PASSWORD: ${{ secrets.ADDISREEL_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check signing secrets
        id: signing
        shell: bash
        run: |
          if [[ -n "$ADDISREEL_KEYSTORE_B64" && -n "$ADDISREEL_KEYSTORE_PASSWORD" && -n "$ADDISREEL_KEY_ALIAS" && -n "$ADDISREEL_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signed Studio release skipped: signing secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Android SDK 35
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble signed Studio APK
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export ADDISREEL_KEYSTORE_PATH="$RUNNER_TEMP/addisreel-studio-sign.jks"
          printf '%s' "$ADDISREEL_KEYSTORE_B64" | base64 --decode > "$ADDISREEL_KEYSTORE_PATH"
          chmod 600 "$ADDISREEL_KEYSTORE_PATH"
          gradle :studio:assembleRelease --no-daemon --console=plain
          APK=studio/build/outputs/apk/release/studio-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$ADDISREEL_KEYSTORE_PATH"
      - name: Upload signed Studio APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AddisReel-Studio-Signed-APK
          path: studio/build/outputs/apk/release/studio-release.apk
          retention-days: 30
