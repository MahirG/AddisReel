name: Publish AddisReel in-app update
on:
  # Explicit one-time promotion per tested, versioned branch; never publish on arbitrary pushes.
  push:
    branches: ['feature/android-v080-cinematic-experience', 'feature/android-v090-continuity-polish', 'feature/addisreel-v100-foundation', 'feature/addisreel-v110-smart-discovery', 'feature/addisreel-v120-fast-start', 'feature/addisreel-v130-network-smart-player', 'feature/addisreel-v140-watch-integrity', 'feature/addisreel-v150-design-system']
    paths:
      - '.release/0.8.0-publish.json'
      - '.release/0.9.0-publish.json'
      - '.release/1.0.0-publish.json'
      - '.release/1.1.0-publish.json'
      - '.release/1.2.0-publish.json'
      - '.release/1.3.0-publish.json'
      - '.release/1.4.0-publish.json'
      - '.release/1.5.0-publish.json'
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes shown inside AddisReel
        required: true
        type: string
      confirm_publish:
        description: Type PUBLISH to confirm this release goes live
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: addisreel-r2-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm_publish == 'PUBLISH') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/feature/android-v080-cinematic-experience' || github.ref == 'refs/heads/feature/android-v090-continuity-polish' || github.ref == 'refs/heads/feature/addisreel-v100-foundation' || github.ref == 'refs/heads/feature/addisreel-v110-smart-discovery' || github.ref == 'refs/heads/feature/addisreel-v120-fast-start' || github.ref == 'refs/heads/feature/addisreel-v130-network-smart-player' || github.ref == 'refs/heads/feature/addisreel-v140-watch-integrity' || github.ref == 'refs/heads/feature/addisreel-v150-design-system'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production-updates
    env:
      ADDISREEL_KEYSTORE_B64: ${{ secrets.ADDISREEL_KEYSTORE_B64 }}
      ADDISREEL_KEYSTORE_PASSWORD: ${{ secrets.ADDISREEL_KEYSTORE_PASSWORD }}
      ADDISREEL_KEY_ALIAS: ${{ secrets.ADDISREEL_KEY_ALIAS }}
      ADDISREEL_KEY_PASSWORD: ${{ secrets.ADDISREEL_KEY_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.ADDISREEL_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ADDISREEL_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      R2_ACCOUNT_ID: 8cd3c74c816b359895b11913b51da3e4
      R2_BUCKET: addisreel-android-releases
    steps:
      - uses: actions/checkout@v4
      - name: Verify one-time publication marker
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os
          branch=os.environ['GITHUB_REF_NAME']
          expected={'feature/android-v080-cinematic-experience':('0.8.0',17),'feature/android-v090-continuity-polish':('0.9.0',18),'feature/addisreel-v100-foundation':('1.0.0',19),'feature/addisreel-v110-smart-discovery':('1.1.0',20),'feature/addisreel-v120-fast-start':('1.2.0',21),'feature/addisreel-v130-network-smart-player':('1.3.0',22),'feature/addisreel-v140-watch-integrity':('1.4.0',23),'feature/addisreel-v150-design-system':('1.5.0',24)}
          assert branch in expected, 'Unexpected publishing branch'
          version,code=expected[branch]
          approved=json.loads(pathlib.Path(f'.release/{version}-publish.json').read_text())
          assert approved == {'version':version,'versionCode':code,'confirm':'PUBLISH','branch':branch}, 'Unexpected release marker'
          gradle=pathlib.Path('app/build.gradle.kts').read_text()
          assert re.search(r'versionCode\s*=\s*'+str(code)+r'\b',gradle) and f'versionName = "{version}"' in gradle, 'Release version mismatch'
          print(f'Approved one-time {version} / build {code} publication')
          PY
      - name: Confirm live Cloudflare readiness
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/android-v080-cinematic-experience'
        shell: bash
        run: bash .github/scripts/live-smoke-v080.sh
      - name: Verify live Phase A playback backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/addisreel-v100-foundation'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://addisreel-catalog.eddieaman475.workers.dev"
          curl --fail --silent --show-error "$URL/health" | python3 -c 'import sys,json;x=json.load(sys.stdin);assert x["status"]=="ok" and x["phase"]>=4 and "multipart-mp4" in x["features"]'
          STATUS=$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$URL/v1/processor/jobs/11111111-1111-4111-8111-111111111111/source")
          test "$STATUS" = 401 || { echo "::error::Processor auth route not ready: $STATUS"; exit 1; }
      - name: Verify live Phase 5 recovery backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/addisreel-v110-smart-discovery'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://addisreel-catalog.eddieaman475.workers.dev"
          curl --fail --silent --show-error "$URL/health" | python3 -c 'import sys,json;x=json.load(sys.stdin);assert x["status"]=="ok" and x["phase"]>=5 and "processor-job-recovery" in x["features"]'
          curl -fsS "$URL/health/ready" | python3 -c 'import sys,json;x=json.load(sys.stdin);assert x["status"]=="ok" and x["phase"]>=5 and "processing-jobs" in x["checks"]'
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H "Origin: $URL" -X POST "$URL/v1/admin/processing-jobs/11111111-1111-4111-8111-111111111111/retry")
          test "$STATUS" = 401 || { echo "::error::Retry authorization unavailable: $STATUS"; exit 1; }
          curl -fsS "$URL/admin/client.js" -o "$RUNNER_TEMP/addisreel-studio-client.js"
          grep -q 'Retry processing' "$RUNNER_TEMP/addisreel-studio-client.js"
      - name: Verify live Phase 6 conditional catalog backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/addisreel-v120-fast-start'
        shell: bash
        run: |
          set -euo pipefail
          URL=https://addisreel-catalog.eddieaman475.workers.dev
          curl -fsS "$URL/health" | python3 -c 'import sys,json;x=json.load(sys.stdin);assert x["status"]=="ok" and x["phase"]>=6 and "catalog-etag" in x["features"]'
          curl -fsS "$URL/health/ready" | python3 -c 'import sys,json;x=json.load(sys.stdin);assert x["status"]=="ok" and x["phase"]>=6 and "processing-jobs" in x["checks"]'
          curl -fsS -D "$RUNNER_TEMP/catalog-headers" "$URL/v1/catalog" -o "$RUNNER_TEMP/catalog.json"
          python3 -c 'import sys,json;assert isinstance(json.load(open(sys.argv[1]))["series"],list)' "$RUNNER_TEMP/catalog.json"
          ETAG=$(grep -i '^etag:' "$RUNNER_TEMP/catalog-headers" | cut -d' ' -f2- | tr -d '\r')
          test -n "$ETAG" || { echo "::error::Catalog ETag missing"; exit 1; }
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H "If-None-Match: $ETAG" "$URL/v1/catalog")
          test "$STATUS" = 304 || { echo "::error::Catalog conditional cache unavailable: $STATUS"; exit 1; }
      - name: Verify licensed catalog and playback security for Build 22
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/addisreel-v130-network-smart-player'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://addisreel-catalog.eddieaman475.workers.dev"
          curl -fsS "$URL/health/ready" | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["status"]=="ok" and x["phase"]>=6 and "catalog-db" in x["checks"]'
          curl -fsS -D "$RUNNER_TEMP/catalog-headers" "$URL/v1/catalog" -o "$RUNNER_TEMP/catalog.json"
          python3 -c 'import json,sys;assert isinstance(json.load(open(sys.argv[1]))["series"],list)' "$RUNNER_TEMP/catalog.json"
          ETAG=$(grep -i '^etag:' "$RUNNER_TEMP/catalog-headers" | cut -d' ' -f2- | tr -d '\r')
          test -n "$ETAG" || { echo "::error::Missing catalog ETag"; exit 1; }
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H "If-None-Match: $ETAG" "$URL/v1/catalog")
          test "$STATUS" = 304 || { echo "::error::Conditional catalog failed: $STATUS"; exit 1; }
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "$URL/v1/processor/jobs/11111111-1111-4111-8111-111111111111/source")
          test "$STATUS" = 401 || { echo "::error::Processor endpoint auth failed: $STATUS"; exit 1; }
      - name: Verify licensed playback and catalog services for Build 23
        if: github.event_name == 'push' && (github.ref == 'refs/heads/feature/addisreel-v140-watch-integrity' || github.ref == 'refs/heads/feature/addisreel-v150-design-system')
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://addisreel-catalog.eddieaman475.workers.dev"
          curl -fsS "$ROOT/health/ready" | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["status"]=="ok" and x["phase"]>=6 and "catalog-db" in x["checks"]'
          curl -fsS -D "$RUNNER_TEMP/catalog-headers" "$ROOT/v1/catalog" -o "$RUNNER_TEMP/catalog.json"
          python3 -c 'import json,sys;assert isinstance(json.load(open(sys.argv[1]))["series"],list)' "$RUNNER_TEMP/catalog.json"
          ETAG=$(grep -i '^etag:' "$RUNNER_TEMP/catalog-headers" | cut -d' ' -f2- | tr -d '\r')
          test -n "$ETAG" || { echo "::error::Public catalog ETag missing"; exit 1; }
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H "If-None-Match: $ETAG" "$ROOT/v1/catalog")
          test "$STATUS" = 304 || { echo "::error::Catalog returned $STATUS instead of 304"; exit 1; }
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "$ROOT/v1/processor/jobs/11111111-1111-4111-8111-111111111111/source")
          test "$STATUS" = 401 || { echo "::error::Protected processor route returned $STATUS"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate credentials and prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          for key in ADDISREEL_KEYSTORE_B64 ADDISREEL_KEYSTORE_PASSWORD ADDISREEL_KEY_ALIAS ADDISREEL_KEY_PASSWORD AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "${!key}" || { echo "::error::Missing secret: $key"; exit 1; }
          done
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Require green API and Android unit tests before upload
        shell: bash
        run: |
          set -euo pipefail
          node --test backend/tests/*.test.mjs
          gradle :app:testDebugUnitTest --no-daemon --console=plain
      - name: Build and verify production-signed APK
        shell: bash
        run: |
          set -euo pipefail
          export ADDISREEL_KEYSTORE_PATH="$RUNNER_TEMP/addisreel-release.jks"
          trap 'rm -f "$ADDISREEL_KEYSTORE_PATH"' EXIT
          printf '%s' "$ADDISREEL_KEYSTORE_B64" | base64 --decode > "$ADDISREEL_KEYSTORE_PATH"
          chmod 600 "$ADDISREEL_KEYSTORE_PATH"
          gradle :app:assembleRelease --no-daemon --console=plain
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n '1p' > "$RUNNER_TEMP/package-info"
          cat "$RUNNER_TEMP/package-info"
          python3 - <<'PY'
          import os, re, json, hashlib, pathlib
          info = pathlib.Path(os.environ['RUNNER_TEMP'], 'package-info').read_text()
          m = re.search(r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", info)
          if not m: raise SystemExit('Cannot parse APK package/version')
          package, code, version = m.groups()
          if package != 'et.addisreel.app': raise SystemExit('Unexpected APK package')
          if not re.fullmatch(r'\d+\.\d+\.\d+', version): raise SystemExit('Invalid semantic version')
          apk = pathlib.Path('app/build/outputs/apk/release/app-release.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          manifest = {'version':version,'versionCode':int(code),'notes':os.environ['RELEASE_NOTES'][:1000], 'objectKey':f'releases/{version}/AddisReel.apk','sha256':digest}
          pathlib.Path('latest.json').write_text(json.dumps(manifest, separators=(',',':'))+'\n')
          print('Verified:', package, version, code, digest)
          PY
        env:
          RELEASE_NOTES: ${{ inputs.release_notes || (github.ref == 'refs/heads/feature/addisreel-v150-design-system' && 'AddisReel 1.5.0 — Refined typography, light and dark appearance, improved Watch layout and adaptive navigation.' || (github.ref == 'refs/heads/feature/addisreel-v140-watch-integrity' && '🎬 AddisReel 1.4.0 — True Viewing History recorded from playback, safer resume after interruptions, and clearer Continue Watching and Watch Again labels.' || (github.ref == 'refs/heads/feature/addisreel-v130-network-smart-player' && '🎬 AddisReel 1.3.0 — Network-smart playback with no video requests while browsing, near-end next-episode preparation, responsive 320px poster tiles, and battery-friendly Wi-Fi preloading.' || (github.ref == 'refs/heads/feature/addisreel-v120-fast-start' && '🎬 AddisReel 1.2.0 — Faster cold starts with a 24-hour offline catalog snapshot, efficient ETag refresh, a reconnect retry, and safer public-content validation.' || (github.ref == 'refs/heads/feature/addisreel-v110-smart-discovery' && '🎬 AddisReel 1.1.0 — Smarter private drama recommendations, Wi-Fi HLS episode preloading, safer processing recovery and duplicate-job prevention. An external FFmpeg processor is still needed for automatic conversion.' || (github.ref == 'refs/heads/feature/addisreel-v100-foundation' && '🎬 AddisReel 1.0.0 — Faster adaptive video playback, resumable large MP4 uploads, authenticated FFmpeg processing integration, and a new operations dashboard. Stream encoding requires a connected FFmpeg host.' || '🎬 AddisReel — Reliable streaming, improved posters and playback continuity.')))))) }}
      - name: Publish immutable APK, then update manifest
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          KEY="$(python3 -c 'import json; print(json.load(open("latest.json"))["objectKey"])')"
          VERSION="$(python3 -c 'import json; print(json.load(open("latest.json"))["version"])')"
          # Fail closed on a stale versioned branch: never downgrade the live
          # manifest even if an old release marker is pushed a second time.
          if aws --endpoint-url "$ENDPOINT" s3 cp "s3://$R2_BUCKET/releases/latest.json" "$RUNNER_TEMP/current-latest.json" >/dev/null 2>&1; then
            python3 - <<'PY'
          import json,os,pathlib
          current=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'current-latest.json').read_text())
          next_release=json.loads(pathlib.Path('latest.json').read_text())
          assert isinstance(current.get('versionCode'),int), 'Live release manifest is invalid'
          assert next_release['versionCode'] > current['versionCode'], 'Release must increase versionCode; refusing downgrade'
          PY
          fi
          # Never overwrite an existing version; bump versionName and versionCode for each release.
          if aws --endpoint-url "$ENDPOINT" s3api head-object --bucket "$R2_BUCKET" --key "$KEY" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists. Bump the app version before publishing."
            exit 1
          fi
          aws --endpoint-url "$ENDPOINT" s3 cp app/build/outputs/apk/release/app-release.apk "s3://$R2_BUCKET/$KEY" --content-type application/vnd.android.package-archive
          aws --endpoint-url "$ENDPOINT" s3 cp latest.json "s3://$R2_BUCKET/releases/latest.json" --content-type application/json --cache-control no-store
          echo "### AddisReel $VERSION published to R2" >> "$GITHUB_STEP_SUMMARY"
          echo "Update endpoint: https://addisreel-updates.eddieaman475.workers.dev/v1/latest" >> "$GITHUB_STEP_SUMMARY"
      - name: Save verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AddisReel-published-signed-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            latest.json
          retention-days: 30
