name: Android APK
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  live-cloudflare-smoke:
    if: github.ref == 'refs/heads/feature/android-v080-cinematic-experience'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed catalog, poster fallback and admin protection
        shell: bash
        run: bash .github/scripts/live-smoke-v080.sh

  live-phase4-smoke:
    if: github.ref == 'refs/heads/feature/addisreel-v100-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify live AddisReel Phase 4 endpoints
        shell: bash
        run: |
          set -euo pipefail
          ROOT=https://addisreel-catalog.eddieaman475.workers.dev
          curl -fsS "$ROOT/health" | python3 -c 'import sys,json;x=json.load(sys.stdin);assert x["status"]=="ok" and x["phase"]>=4 and "processor-hls" in x["features"]'
          curl -fsS "$ROOT/v1/catalog" | python3 -c 'import sys,json;assert isinstance(json.load(sys.stdin)["series"],list)'
          curl -fsS "$ROOT/admin/client.js" -o "$RUNNER_TEMP/addisreel-studio-client.js"
          grep -q uploadLargeMp4 "$RUNNER_TEMP/addisreel-studio-client.js"
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "$ROOT/v1/processor/jobs/11111111-1111-4111-8111-111111111111/source")
          test "$STATUS" = 401
          echo "### Phase 4 live backend verified" >> "$GITHUB_STEP_SUMMARY"

  live-phase5-smoke:
    if: github.ref == 'refs/heads/feature/addisreel-v110-smart-discovery'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify live Phase 5 backend and protected retry endpoint
        shell: bash
        run: |
          set -euo pipefail
          ROOT=https://addisreel-catalog.eddieaman475.workers.dev
          curl -fsS "$ROOT/health" | python3 -c 'import sys,json;x=json.load(sys.stdin);assert x["status"]=="ok" and x["phase"]>=5 and "processor-job-recovery" in x["features"]'
          curl -fsS "$ROOT/v1/catalog" | python3 -c 'import sys,json;assert isinstance(json.load(sys.stdin)["series"],list)'
          curl -fsS "$ROOT/admin/client.js" -o "$RUNNER_TEMP/addisreel-studio-client.js"
          grep -q 'Retry processing' "$RUNNER_TEMP/addisreel-studio-client.js"
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H "Origin: $ROOT" -X POST "$ROOT/v1/admin/processing-jobs/11111111-1111-4111-8111-111111111111/retry")
          test "$STATUS" = 401 || { echo "::error::Retry must reject anonymous requests; got $STATUS"; exit 1; }
          echo "### Phase 5 backend verified" >> "$GITHUB_STEP_SUMMARY"

  catalog-api-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run catalog API tests
        run: node --test backend/tests/*.test.mjs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-35" || echo "API 35 platform needs installation"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee android-build.log
      - name: Summarize build failure
        if: failure()
        shell: bash
        run: |
          {
            echo "## AddisReel Android build failure"
            echo ""
            echo "### First actionable errors"
            echo '```text'
            grep -n -m 20 -E '(^e: |^FAILURE:|^\* What went wrong:|^> |^Caused by:|^.* error:|Could not resolve|Could not find|Unresolved reference|Compilation error)' android-build.log || tail -n 70 android-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AddisReel-gradle-build-log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Run Android playback regression tests
        shell: bash
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain
      - name: Verify generated APK integrity
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          echo "### APK verified" >> "$GITHUB_STEP_SUMMARY"
          echo "File: \`$APK\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AddisReel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AddisReel-build-diagnostics
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      ADDISREEL_KEYSTORE_B64: ${{ secrets.ADDISREEL_KEYSTORE_B64 }}
      ADDISREEL_KEYSTORE_PASSWORD: ${{ secrets.ADDISREEL_KEYSTORE_PASSWORD }}
      ADDISREEL_KEY_ALIAS: ${{ secrets.ADDISREEL_KEY_ALIAS }}
      ADDISREEL_KEY_PASSWORD: ${{ secrets.ADDISREEL_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$ADDISREEL_KEYSTORE_B64" && -n "$ADDISREEL_KEYSTORE_PASSWORD" && -n "$ADDISREEL_KEY_ALIAS" && -n "$ADDISREEL_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signed release skipped: configure four ADDISREEL signing secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Android SDK 35 for release build
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed production APK
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export ADDISREEL_KEYSTORE_PATH="$RUNNER_TEMP/addisreel-release.jks"
          printf '%s' "$ADDISREEL_KEYSTORE_B64" | base64 --decode > "$ADDISREEL_KEYSTORE_PATH"
          chmod 600 "$ADDISREEL_KEYSTORE_PATH"
          gradle :app:assembleRelease --no-daemon --console=plain
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$ADDISREEL_KEYSTORE_PATH"
      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AddisReel-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
