name: AddisReel 1.7 Premium visual smoke
on:
  push:
    branches: ['feature/addisreel-creator-studio-phase3-premieres']
    paths:
      - 'app/src/main/java/et/addisreel/app/PremiumExperience.kt'
      - 'app/src/main/java/et/addisreel/app/MainActivity.kt'
      - 'app/src/main/res/values*/strings.xml'
      - '.github/workflows/premium-v170-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  premium-screen:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - theme: 'no'
            font: '1.0'
            device: normal
          - theme: 'yes'
            font: '2.0'
            device: compact
    env:
      QA_STAGE: candidate
      QA_THEME: ${{ matrix.theme }}
      QA_FONT: ${{ matrix.font }}
      QA_DEVICE: ${{ matrix.device }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile visual candidate
        run: gradle :app:assembleDebug --no-daemon --console=plain
      - name: Verify hardware emulator acceleration
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30 || true
          if [ -c /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          if python3 -c 'import os,fcntl; fd=os.open("/dev/kvm",os.O_RDWR); assert fcntl.ioctl(fd,0xAE00,0)==12; os.close(fd)'; then
            echo "disabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "disabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Capture actual Premium tab and neighboring screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 1200
          disable-linux-hw-accel: ${{ steps.kvm.outputs.disabled }}
          disable-animations: true
          script: bash .github/scripts/visual-qa-android.sh
      - name: Save real emulator screenshots and accessibility trees
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-v170-${{ matrix.device }}-${{ matrix.theme }}-${{ matrix.font }}
          path: visual-qa/
          retention-days: 14
          if-no-files-found: warn
